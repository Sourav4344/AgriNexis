# ==============================================================================
# AgriNexis Docker Compose Orchestration
# Local development & SIH 2026 Hackathon Demo Stack
# ==============================================================================
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f api
#   docker compose down
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agrinexis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable must be set}
      POSTGRES_DB: ${POSTGRES_DB:-agrinexis}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agrinexis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agrinexis-net

  # ----------------------------------------------------------------------------
  # FastAPI Core Service (Modular Monolith)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: agrinexis-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-agrinexis}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-produce-quality-images}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-demo}
      MARKET_LIVE_MAX_AGE_MINUTES: ${MARKET_LIVE_MAX_AGE_MINUTES:-180}
      MARKET_CACHE_MAX_AGE_HOURS: ${MARKET_CACHE_MAX_AGE_HOURS:-48}
      MARKET_SOURCE_TIMEZONE: ${MARKET_SOURCE_TIMEZONE:-Asia/Kolkata}
      MARKET_DEMO_FALLBACK_ENABLED: ${MARKET_DEMO_FALLBACK_ENABLED:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - agrinexis-net

  # ----------------------------------------------------------------------------
  # Buyer & FPO Web Dashboard
  # ----------------------------------------------------------------------------
  buyer-web:
    build:
      context: .
      dockerfile: apps/buyer-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    container_name: agrinexis-buyer-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - agrinexis-net

  # ----------------------------------------------------------------------------
  # Admin Web Dashboard
  # ----------------------------------------------------------------------------
  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_ADMIN_DEMO_MODE: ${NEXT_PUBLIC_ADMIN_DEMO_MODE:-false}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    container_name: agrinexis-admin-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_ADMIN_DEMO_MODE: ${NEXT_PUBLIC_ADMIN_DEMO_MODE:-false}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - agrinexis-net

# ------------------------------------------------------------------------------
# Storage Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: agrinexis_postgres_data

networks:
  agrinexis-net:
    name: agrinexis_network
    driver: bridge
