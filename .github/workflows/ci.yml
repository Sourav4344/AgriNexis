name: AgriNexis CI Pipeline

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main", "feature/*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Python Modular Monolith & Intelligence Engines
  # ----------------------------------------------------------------------------
  python-ci:
    name: Python Services & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest==8.3.5 \
            pytest-asyncio==0.26.0 \
            ruff==0.11.5 \
            mypy==1.15.0 \
            fastapi==0.115.12 \
            uvicorn[standard]==0.34.2 \
            pydantic==2.11.3 \
            pydantic-settings==2.9.1 \
            asyncpg==0.30.0 \
            httpx==0.28.1 \
            "PyJWT[crypto]==2.10.1" \
            tzdata

      - name: Bytecode compilation check
        run: python -m compileall services

      - name: Lint Python services with Ruff
        run: |
          ruff check services/api
          ruff check services/market-engine --select E,F,I,B,UP --ignore B008,E501,I001
          ruff check services/matching-engine
          ruff check services/prediction-engine --ignore E501
          ruff check services/logistics-engine
          ruff check services/quality-engine
          ruff check services/transactions

      - name: Type check Python services with Mypy
        run: |
          mypy --ignore-missing-imports --no-warn-unused-ignores \
            services/api/app \
            services/market-engine/market_engine \
            services/matching-engine/matching_engine \
            services/prediction-engine/prediction_engine \
            services/logistics-engine/logistics_engine \
            services/quality-engine/quality_engine \
            services/transactions/transactions

      - name: Run pytest test suite across all services and integration flows
        run: |
          export PYTHONPATH="$PWD/services/api:$PWD/services/market-engine:$PWD/services/matching-engine:$PWD/services/prediction-engine:$PWD/services/logistics-engine:$PWD/services/quality-engine:$PWD/services/transactions"

          echo "=== Testing services/api ==="
          pytest -c services/api/pyproject.toml services/api/tests

          echo "=== Testing services/market-engine ==="
          pytest -c services/market-engine/pyproject.toml services/market-engine/tests

          echo "=== Testing services/matching-engine ==="
          pytest -c services/matching-engine/pyproject.toml services/matching-engine/tests

          echo "=== Testing services/prediction-engine ==="
          pytest -c services/prediction-engine/pyproject.toml services/prediction-engine/tests

          echo "=== Testing services/logistics-engine ==="
          pytest -c services/logistics-engine/pyproject.toml services/logistics-engine/tests

          echo "=== Testing services/quality-engine ==="
          pytest -c services/quality-engine/pyproject.toml services/quality-engine/tests

          echo "=== Testing services/transactions ==="
          pytest -c services/transactions/pyproject.toml services/transactions/tests

          echo "=== Testing root end-to-end integration and security test suites ==="
          pytest tests/test_sih_integration_flow.py tests/test_qa_security_hardening.py

  # ----------------------------------------------------------------------------
  # Job 2: Buyer & FPO Web Dashboard (Next.js 14)
  # ----------------------------------------------------------------------------
  buyer-web-ci:
    name: Buyer Web Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/buyer-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/buyer-web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run unit & contract tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_DEMO_MODE: "true"

  # ----------------------------------------------------------------------------
  # Job 3: Admin Operations Dashboard (Next.js 15)
  # ----------------------------------------------------------------------------
  admin-web-ci:
    name: Admin Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run unit & component tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_ADMIN_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_ADMIN_DEMO_MODE: "true"
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_DEMO_MODE: "true"

  # ----------------------------------------------------------------------------
  # Job 4: Git Hygiene & Docker Configuration Validation
  # ----------------------------------------------------------------------------
  orchestration-and-hygiene:
    name: Docker & Git Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for whitespace errors or merge conflict markers
        run: git diff --check

      - name: Validate Docker Compose Configuration
        run: docker compose config
